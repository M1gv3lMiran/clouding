<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#0f0d13" />
  <title>Armario IA · Tu asesor de estilo</title>
  <meta name="description" content="Chatbot de estilismo personal: envíale fotos o descripciones de tu ropa y te aconseja cómo combinarla, cuándo llevarla y qué comprar." />
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E%F0%9F%91%97%3C/text%3E%3C/svg%3E" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body>
  <div class="app">
    <header class="topbar">
      <div class="brand">
        <span class="brand-logo">👗</span>
        <div class="brand-text">
          <h1>Armario IA</h1>
          <p>Tu asesor de estilo personal</p>
        </div>
      </div>
      <button id="settingsBtn" class="icon-btn" title="Ajustes" aria-label="Ajustes">⚙️</button>
    </header>

    <main id="messages" class="messages" aria-live="polite"></main>

    <div id="attachments" class="attachments" hidden></div>

    <form id="composer" class="composer" autocomplete="off">
      <label class="attach-btn" title="Adjuntar foto" aria-label="Adjuntar foto">
        <input id="fileInput" type="file" accept="image/*" multiple hidden />
        📷
      </label>
      <textarea id="input" class="input" rows="1" placeholder="Describe tu prenda o escribe una duda…" enterkeyhint="send"></textarea>
      <button id="sendBtn" class="send-btn" type="submit" title="Enviar" aria-label="Enviar">➤</button>
    </form>
  </div>

  <!-- Panel de ajustes -->
  <div id="settingsOverlay" class="overlay" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="settingsTitle">
      <div class="modal-head">
        <h2 id="settingsTitle">Ajustes</h2>
        <button id="closeSettings" class="icon-btn" aria-label="Cerrar">✕</button>
      </div>

      <label class="field-label" for="apiKey">Clave de API de Anthropic</label>
      <input id="apiKey" class="text-field" type="password" placeholder="sk-ant-…" autocomplete="off" />
      <p class="hint">
        La clave se guarda <strong>solo en este dispositivo</strong> y se usa para hablar con la IA.
        Consíguela gratis en <a href="https://console.anthropic.com/settings/keys" target="_blank" rel="noopener">console.anthropic.com</a>.
      </p>

      <label class="field-label" for="model">Modelo de IA</label>
      <select id="model" class="text-field">
        <option value="claude-sonnet-5">Sonnet 5 · equilibrado (recomendado)</option>
        <option value="claude-opus-4-8">Opus 4.8 · máxima calidad</option>
        <option value="claude-haiku-4-5-20251001">Haiku 4.5 · rápido y económico</option>
      </select>

      <div class="modal-actions">
        <button id="clearChat" class="btn-ghost" type="button">Borrar conversación</button>
        <button id="saveSettings" class="btn-primary" type="button">Guardar</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
